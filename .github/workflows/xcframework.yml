name: Build XCFramework

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag for the XCFramework
        required: true
        default: xcframework-4.4.2-jsj.1

permissions:
  contents: write

jobs:
  build:
    name: Build distribution XCFramework
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData
          key: xcframework-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift') }}

      - name: Build universal macOS framework
        run: |
          xcodebuild \
            -scheme AppStoreConnect-Swift-SDK \
            -destination "generic/platform=macOS" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            OTHER_SWIFT_FLAGS='$(inherited) -no-verify-emitted-module-interface' \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Create and verify XCFramework
        run: |
          products="$RUNNER_TEMP/DerivedData/Build/Products/Release"
          framework="$RUNNER_TEMP/AppStoreConnect_Swift_SDK.framework"
          output="$RUNNER_TEMP/AppStoreConnect_Swift_SDK.xcframework"

          test -d "$products/AppStoreConnect_Swift_SDK.swiftmodule"

          objects="$RUNNER_TEMP/DerivedData/Build/Intermediates.noindex/AppStoreConnect-Swift-SDK.build/Release/AppStoreConnect-Swift-SDK.build/Objects-normal"
          test -d "$objects/arm64"
          test -d "$objects/x86_64"
          find "$objects/arm64" -name '*.o' -print0 | xargs -0 libtool -static -o "$RUNNER_TEMP/AppStoreConnect_Swift_SDK-arm64.a"
          find "$objects/x86_64" -name '*.o' -print0 | xargs -0 libtool -static -o "$RUNNER_TEMP/AppStoreConnect_Swift_SDK-x86_64.a"
          lipo -create \
            "$RUNNER_TEMP/AppStoreConnect_Swift_SDK-arm64.a" \
            "$RUNNER_TEMP/AppStoreConnect_Swift_SDK-x86_64.a" \
            -output "$RUNNER_TEMP/AppStoreConnect_Swift_SDK.a"

          mkdir -p "$framework/Versions/A/Headers"
          mkdir -p "$framework/Versions/A/Modules"
          mkdir -p "$framework/Versions/A/Resources"
          cp \
            "$RUNNER_TEMP/AppStoreConnect_Swift_SDK.a" \
            "$framework/Versions/A/AppStoreConnect_Swift_SDK"
          cp -R \
            "$products/AppStoreConnect_Swift_SDK.swiftmodule" \
            "$framework/Versions/A/Modules/"

          header="$(find "$RUNNER_TEMP/DerivedData/Build/Intermediates.noindex" -name 'AppStoreConnect-Swift-SDK-Swift.h' | head -1)"
          test -f "$header"
          cp "$header" "$framework/Versions/A/Headers/AppStoreConnect_Swift_SDK-Swift.h"

          plist="$framework/Versions/A/Resources/Info.plist"
          plutil -create xml1 "$plist"
          plutil -insert CFBundleExecutable -string AppStoreConnect_Swift_SDK "$plist"
          plutil -insert CFBundleIdentifier -string com.jsj.AppStoreConnect-Swift-SDK "$plist"
          plutil -insert CFBundleInfoDictionaryVersion -string 6.0 "$plist"
          plutil -insert CFBundleName -string AppStoreConnect_Swift_SDK "$plist"
          plutil -insert CFBundlePackageType -string FMWK "$plist"
          plutil -insert CFBundleShortVersionString -string 4.4.2 "$plist"
          plutil -insert CFBundleVersion -string 1 "$plist"
          plutil -insert LSMinimumSystemVersion -string 11.0 "$plist"

          ln -s A "$framework/Versions/Current"
          ln -s Versions/Current/AppStoreConnect_Swift_SDK "$framework/AppStoreConnect_Swift_SDK"
          ln -s Versions/Current/Headers "$framework/Headers"
          ln -s Versions/Current/Modules "$framework/Modules"
          ln -s Versions/Current/Resources "$framework/Resources"

          xcodebuild -create-xcframework -framework "$framework" -output "$output"

          binary="$output/macos-arm64_x86_64/AppStoreConnect_Swift_SDK.framework/AppStoreConnect_Swift_SDK"
          architectures="$(lipo -archs "$binary")"
          [[ "$architectures" == *arm64* ]]
          [[ "$architectures" == *x86_64* ]]

          interface_count="$(find "$output" -name '*.swiftinterface' | wc -l | tr -d ' ')"
          [[ "$interface_count" -ge 2 ]]

          ditto -c -k --sequesterRsrc --keepParent \
            "$output" \
            "$RUNNER_TEMP/AppStoreConnect-Swift-SDK.xcframework.zip"
          shasum -a 256 "$RUNNER_TEMP/AppStoreConnect-Swift-SDK.xcframework.zip" | tee "$RUNNER_TEMP/checksum.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppStoreConnect-Swift-SDK.xcframework
          path: |
            ${{ runner.temp }}/AppStoreConnect-Swift-SDK.xcframework.zip
            ${{ runner.temp }}/checksum.txt
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          asset="$RUNNER_TEMP/AppStoreConnect-Swift-SDK.xcframework.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" --clobber
          else
            gh release create "$RELEASE_TAG" "$asset" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "A distribution-compatible macOS XCFramework for AppStoreConnect-Swift-SDK 4.4.2."
          fi
